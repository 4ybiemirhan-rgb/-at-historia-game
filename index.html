<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pax Historia Style - Fullscreen Map Strategy</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --panel-bg: rgba(30, 41, 59, 0.88);
            --panel-border: rgba(51, 65, 85, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #070d19; color: var(--text-main); }

 .map-viewport {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            background: url('world-map.png') no-repeat center center;
            background-size: contain; /* Görselin oranını koruyarak tam oturmasını sağlar */
            background-color: #0d1b2a;
            z-index: 1;
        }
        /* SVG TIKLAMA KATMANI */
        svg#interactive-overlay {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            z-index: 2;
        }

        /* Tıklanabilir Ülke Sınır Alanları */
        .country-region {
            fill: rgba(255, 255, 255, 0.01);
            stroke: rgba(255, 255, 255, 0.15);
            stroke-width: 1;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .country-region:hover {
            fill: rgba(59, 130, 246, 0.35);
            stroke: #60a5fa;
            stroke-width: 2;
        }

        .country-region.player-country {
            fill: rgba(34, 197, 94, 0.45);
            stroke: #22c55e;
            stroke-width: 2.5;
        }

        .country-region.selected-country {
            fill: rgba(239, 68, 68, 0.5);
            stroke: #ef4444;
            stroke-width: 2.5;
        }

        /* YÜZEN PANELLER (OVERLAY UI) */
        .top-bar {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1100px;
            background: var(--panel-bg); backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border); border-radius: 12px;
            padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
            z-index: 10; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .stats-group { display: flex; gap: 20px; }
        .stat-box { display: flex; flex-direction: column; }
        .stat-box span:first-child { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .stat-box span:last-child { font-size: 0.95rem; font-weight: bold; }

        .turn-box { display: flex; align-items: center; gap: 15px; }
        .next-turn-btn { background: var(--success); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .left-overlay {
            position: absolute; top: 85px; left: 20px; width: 310px;
            display: flex; flex-direction: column; gap: 12px; z-index: 10;
        }

        .panel-card {
            background: var(--panel-bg); backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border); border-radius: 12px; padding: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
        .action-btn { background: rgba(51, 65, 85, 0.8); color: white; border: 1px solid var(--panel-border); padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; text-align: left; }
        .action-btn:hover { background: var(--accent); }

        .country-select-list { max-height: 180px; overflow-y: auto; list-style: none; margin-top: 8px; }
        .country-select-item { padding: 6px 10px; border-radius: 6px; display: flex; justify-content: space-between; cursor: pointer; font-size: 0.85rem; margin-bottom: 4px; background: rgba(255,255,255,0.03); }
        .country-select-item:hover, .country-select-item.active { background: rgba(59, 130, 246, 0.3); }

        .right-overlay {
            position: absolute; top: 85px; right: 20px; width: 320px;
            display: flex; flex-direction: column; gap: 12px; z-index: 10;
        }

        .chat-box { height: 120px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--panel-border); border-radius: 6px; padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; }
        .chat-msg { padding: 6px 10px; border-radius: 6px; max-width: 85%; }
        .chat-msg.player { background: var(--accent); align-self: flex-end; }
        .chat-msg.ai { background: #334155; align-self: flex-start; }

        .chat-input-area { display: flex; gap: 6px; margin-top: 6px; }
        .chat-input { flex: 1; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--panel-border); border-radius: 6px; padding: 6px; color: white; font-size: 0.8rem; }
        .send-btn { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }

        .news-feed { max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; }
        .news-item { padding: 6px 8px; background: rgba(0,0,0,0.3); border-left: 3px solid var(--accent); border-radius: 4px; }
    </style>
</head>
<body>

    <!-- TAM EKRAN GERÇEK RESİM HARİTASI -->
    <div class="map-viewport">
      <svg id="interactive-overlay" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
            <g id="regions">
                <!-- Türkiye (Anadolu / Trakya Konumu) -->
                <path id="region-Türkiye" class="country-region player-country" d="M 525,215 L 560,210 L 565,235 L 520,240 Z" onclick="selectCountry('Türkiye')"><title>Türkiye</title></path>
                
                <!-- Yunanistan -->
                <path id="region-Yunanistan" class="country-region" d="M 505,218 L 522,215 L 520,238 L 502,235 Z" onclick="selectCountry('Yunanistan')"><title>Yunanistan</title></path>
                
                <!-- ABD (Kuzey Amerika) -->
                <path id="region-ABD" class="country-region" d="M 140,140 L 290,120 L 280,240 L 160,230 Z" onclick="selectCountry('ABD')"><title>ABD</title></path>
                
                <!-- Çin -->
                <path id="region-Çin" class="country-region" d="M 680,180 L 800,165 L 815,270 L 690,265 Z" onclick="selectCountry('Çin')"><title>Çin</title></path>
                
                <!-- Almanya -->
                <path id="region-Almanya" class="country-region" d="M 470,170 L 495,168 L 493,192 L 468,195 Z" onclick="selectCountry('Almanya')"><title>Almanya</title></path>
                
                <!-- Rusya -->
                <path id="region-Rusya" class="country-region" d="M 480,70 L 850,55 L 840,160 L 490,150 Z" onclick="selectCountry('Rusya')"><title>Rusya</title></path>
                
                <!-- İngiltere -->
                <path id="region-İngiltere" class="country-region" d="M 440,155 L 460,152 L 458,175 L 438,175 Z" onclick="selectCountry('İngiltere')"><title>İngiltere</title></path>
                
                <!-- Fransa -->
                <path id="region-Fransa" class="country-region" d="M 445,180 L 470,178 L 465,205 L 440,205 Z" onclick="selectCountry('Fransa')"><title>Fransa</title></path>
                
                <!-- Japonya -->
                <path id="region-Japonya" class="country-region" d="M 850,200 L 875,195 L 880,245 L 855,245 Z" onclick="selectCountry('Japonya')"><title>Japonya</title></path>
                
                <!-- Brezilya (Güney Amerika) -->
                <path id="region-Brezilya" class="country-region" d="M 300,320 L 390,330 L 360,450 L 280,390 Z" onclick="selectCountry('Brezilya')"><title>Brezilya</title></path>
                
                <!-- Hindistan -->
                <path id="region-Hindistan" class="country-region" d="M 650,235 L 700,230 L 690,310 L 640,270 Z" onclick="selectCountry('Hindistan')"><title>Hindistan</title></path>
                
                <!-- İran -->
                <path id="region-İran" class="country-region" d="M 575,225 L 620,220 L 615,265 L 570,260 Z" onclick="selectCountry('İran')"><title>İran</title></path>
            </g>
        </svg>
    </div>

    <!-- ÜST BİLGİ BARI -->
    <div class="top-bar">
        <div class="stats-group">
            <div class="stat-box"><span>Ülke</span><span id="stat-name">Türkiye</span></div>
            <div class="stat-box"><span>Bütçe</span><span id="stat-money">120 M$</span></div>
            <div class="stat-box"><span>Nüfus</span><span id="stat-pop">85 M</span></div>
            <div class="stat-box"><span>Asker</span><span id="stat-army">750 Bin</span></div>
            <div class="stat-box"><span>İstikrar</span><span id="stat-stability">%85</span></div>
        </div>
        <div class="turn-box">
            <span id="current-date" style="font-size:0.9rem; font-weight:bold;">2026 / Ocak</span>
            <button class="next-turn-btn" onclick="nextTurn()">Turu Bitir ➡️</button>
        </div>
    </div>

    <!-- SOL YÜZEN PANEL -->
    <div class="left-overlay">
        <div class="panel-card">
            <h3 id="selected-country-title" style="color:var(--accent); font-size:1rem;">Hedef: ABD</h3>
            <p id="selected-country-desc" style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Haritadaki ülke sınırlarına tıklayın.</p>
            
            <div class="action-grid">
                <button class="action-btn" onclick="doAction('alliance')">🤝 İttifak</button>
                <button class="action-btn" onclick="doAction('trade')">📦 Ticaret</button>
                <button class="action-btn" onclick="doAction('aid')">💰 Yardım</button>
                <button class="action-btn" onclick="doAction('war')" style="border-left:3px solid var(--danger);">⚔️ Savaş</button>
            </div>
        </div>

        <div class="panel-card">
            <h4 style="font-size:0.85rem; color:var(--text-muted);">Dünya Ülkeleri</h4>
            <ul class="country-select-list" id="country-list"></ul>
        </div>
    </div>

    <!-- SAĞ YÜZEN PANEL -->
    <div class="right-overlay">
        <div class="panel-card">
            <h4 style="font-size:0.85rem; margin-bottom:6px;">💬 Lider Diplomatik Hattı</h4>
            <div class="chat-box" id="chat-box">
                <div class="chat-msg ai">Dünya sahnesinde hamlelerinizi bekliyoruz.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" class="chat-input" placeholder="Diplomatik mesaj...">
                <button class="send-btn" onclick="sendDiplomacy()">Gönder</button>
            </div>
        </div>

        <div class="panel-card">
            <h4 style="font-size:0.85rem; margin-bottom:6px;">📰 Dünya Olayları</h4>
            <div class="news-feed" id="news-feed">
                <div class="news-item">Ülke sınır alanları haritaya tam hizalandı.</div>
            </div>
        </div>
    </div>

    <script>
        const countries = {
            "Türkiye": { name: "Türkiye", money: 120, pop: 85, army: 750, stability: 85, relation: 50 },
            "ABD": { name: "ABD", money: 850, pop: 335, army: 2100, stability: 90, relation: 60 },
            "Çin": { name: "Çin", money: 720, pop: 1410, army: 2500, stability: 92, relation: 40 },
            "Almanya": { name: "Almanya", money: 450, pop: 84, army: 180, stability: 95, relation: 70 },
            "Rusya": { name: "Rusya", money: 380, pop: 144, army: 1300, stability: 78, relation: 30 },
            "İngiltere": { name: "İngiltere", money: 330, pop: 67, army: 150, stability: 91, relation: 65 },
            "Fransa": { name: "Fransa", money: 310, pop: 68, army: 200, stability: 88, relation: 60 },
            "Japonya": { name: "Japonya", money: 500, pop: 125, army: 250, stability: 96, relation: 65 },
            "Brezilya": { name: "Brezilya", money: 190, pop: 215, army: 360, stability: 80, relation: 55 },
            "Hindistan": { name: "Hindistan", money: 350, pop: 1420, army: 3000, stability: 82, relation: 50 },
            "Yunanistan": { name: "Yunanistan", money: 45, pop: 10, army: 120, stability: 85, relation: 25 },
            "İran": { name: "İran", money: 70, pop: 89, army: 600, stability: 70, relation: 35 }
        };

        let playerCountry = "Türkiye";
        let selectedTarget = "ABD";
        let year = 2026;
        let month = 1;
        const months = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

        function init() {
            renderCountryList();
            updateMapHighlight();
            updatePlayerStats();
            updateTargetInfo();
        }

        function renderCountryList() {
            const list = document.getElementById("country-list");
            list.innerHTML = "";
            for (let key in countries) {
                if (key === playerCountry) continue;
                const li = document.createElement("li");
                li.className = `country-select-item ${key === selectedTarget ? 'active' : ''}`;
                li.innerHTML = `<span>${countries[key].name}</span> <span style="color:var(--text-muted); font-size:0.75rem;">${countries[key].relation}/100</span>`;
                li.onclick = () => selectCountry(key);
                list.appendChild(li);
            }
        }

        function updateMapHighlight() {
            for (let key in countries) {
                const path = document.getElementById(`region-${key}`);
                if (!path) continue;

                path.classList.remove('player-country', 'selected-country');
                if (key === playerCountry) {
                    path.classList.add('player-country');
                } else if (key === selectedTarget) {
                    path.classList.add('selected-country');
                }
            }
        }

        function selectCountry(key) {
            if (key === playerCountry) return;
            selectedTarget = key;
            renderCountryList();
            updateMapHighlight();
            updateTargetInfo();
        }

        function updatePlayerStats() {
            const p = countries[playerCountry];
            document.getElementById("stat-name").innerText = p.name;
            document.getElementById("stat-money").innerText = p.money + " M$";
            document.getElementById("stat-pop").innerText = p.pop + " M";
            document.getElementById("stat-army").innerText = p.army.toLocaleString() + " Bin";
            document.getElementById("stat-stability").innerText = "%" + p.stability;
        }

        function updateTargetInfo() {
            const t = countries[selectedTarget];
            document.getElementById("selected-country-title").innerText = `Hedef: ${t.name}`;
            document.getElementById("selected-country-desc").innerText = `İlişki Puanı: ${t.relation}/100`;
        }

        function nextTurn() {
            month++;
            if (month > 12) { month = 1; year++; }
            document.getElementById("current-date").innerText = `${year} / ${months[month-1]}`;
            countries[playerCountry].money += 5;
            updatePlayerStats();
            addNews(`Tarih ilerledi: ${months[month-1]} ${year}.`);
        }

        function addNews(text) {
            const feed = document.getElementById("news-feed");
            const item = document.createElement("div");
            item.className = "news-item";
            item.innerText = text;
            feed.prepend(item);
        }

        function doAction(type) {
            const t = countries[selectedTarget];
            if (type === 'alliance') {
                if (t.relation >= 60) {
                    t.relation += 10;
                    addNews(`🎉 ${t.name} ile ittifak kuruldu!`);
                } else {
                    addNews(`❌ ${t.name} teklifi reddetti.`);
                }
            } else if (type === 'trade') {
                countries[playerCountry].money += 15;
                addNews(`📦 ${t.name} ile ticaret yapıldı (+15 M$).`);
            } else if (type === 'aid') {
                if (countries[playerCountry].money >= 10) {
                    countries[playerCountry].money -= 10;
                    t.relation += 15;
                    addNews(`💰 ${t.name} ülkesine yardım edildi.`);
                } else {
                    addNews(`❌ Yeterli bütçe yok.`);
                }
            } else if (type === 'war') {
                t.relation = 0;
                countries[playerCountry].stability -= 10;
                addNews(`⚔️ ${t.name} ülkesine savaş açıldı!`);
            }
            updatePlayerStats();
            updateTargetInfo();
            renderCountryList();
            updateMapHighlight();
        }

        function sendDiplomacy() {
            const input = document.getElementById("chat-input");
            const val = input.value.trim();
            if(!val) return;

            const box = document.getElementById("chat-box");
            box.innerHTML += `<div class="chat-msg player">${val}</div>`;
            input.value = "";

            setTimeout(() => {
                box.innerHTML += `<div class="chat-msg ai">${countries[selectedTarget].name}: Talebiniz değerlendirmeye alındı.</div>`;
                box.scrollTop = box.scrollHeight;
            }, 800);
            box.scrollTop = box.scrollHeight;
        }

        init();
    </script>
</body>
</html>
