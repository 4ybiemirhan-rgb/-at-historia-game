<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Çağ Strateji Simülasyonu - Dünya Haritası</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .game-title { font-size: 1.25rem; font-weight: bold; color: var(--accent); }
        .turn-display { display: flex; gap: 15px; align-items: center; font-size: 0.95rem; }
        .next-turn-btn { background: var(--success); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .next-turn-btn:hover { background: #16a34a; }

        .country-stats { background: #111827; padding: 10px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        .stat-item { background: var(--panel-bg); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .stat-label { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
        .stat-value { font-weight: bold; font-size: 1.05rem; }

        .main-container { display: grid; grid-template-columns: 260px 1fr 300px; flex: 1; overflow: hidden; }
        .sidebar, .right-panel { background: var(--panel-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; overflow-y: auto; }
        .right-panel { border-right: none; border-left: 1px solid var(--border-color); }
        .panel-header { padding: 12px 15px; font-weight: bold; border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.2); font-size: 0.95rem; }
        
        .country-list { list-style: none; padding: 8px; }
        .country-item { padding: 8px 10px; margin-bottom: 4px; border-radius: 6px; background: rgba(255,255,255,0.03); cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; font-size: 0.85rem; transition: all 0.2s; }
        .country-item:hover { background: rgba(255,255,255,0.06); }
        .country-item.active { border-color: var(--accent); background: rgba(59, 130, 246, 0.15); }

        .center-content { padding: 15px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; background: #0b1120; }
        
        /* Gerçek Dünya Haritası Görsel Kaplama */
        .map-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; align-items: center; position: relative; }
        .map-wrapper { 
            position: relative; 
            width: 100%; 
            height: 280px; 
            background: url('https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg') no-repeat center center; 
            background-size: contain; 
            background-color: #0d1b2a; 
            border-radius: 8px; 
            border: 1px solid #1e293b;
        }

        .map-marker {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s;
        }

        .map-marker .pin {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #3b82f6;
            border: 2px solid #ffffff;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
            transition: transform 0.2s;
        }

        .map-marker:hover .pin {
            transform: scale(1.4);
            background-color: #60a5fa;
        }

            background-color: #22c55
