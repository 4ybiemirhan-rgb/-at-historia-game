<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Çağ Strateji Simülasyonu - SVG Harita</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .game-title { font-size: 1.25rem; font-weight: bold; color: var(--accent); }
        .turn-display { display: flex; gap: 15px; align-items: center; font-size: 0.95rem; }
        .next-turn-btn { background: var(--success); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .next-turn-btn:hover { background: #16a34a; }

        .country-stats { background: #111827; padding: 10px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        .stat-item { background: var(--panel-bg); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .stat-label { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
        .stat-value { font-weight: bold; font-size: 1.05rem; }

        .main-container { display: grid; grid-template-columns: 260px 1fr 300px; flex: 1; overflow: hidden; }
        .sidebar, .right-panel { background: var(--panel-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; overflow-y: auto; }
        .right-panel { border-right: none; border-left: 1px solid var(--border-color); }
        .panel-header { padding: 12px 15px; font-weight: bold; border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.2); font-size: 0.95rem; }
        
        .country-list { list-style: none; padding: 8px; }
        .country-item { padding: 8px 10px; margin-bottom: 4px; border-radius: 6px; background: rgba(255,255,255,0.03); cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; font-size: 0.85rem; transition: all 0.2s; }
        .country-item:hover { background: rgba(255,255,255,0.06); }
        .country-item.active { border-color: var(--accent); background: rgba(59, 130, 246, 0.15); }

        .center-content { padding: 15px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; background: #0b1120; }
        
        /* İnteraktif SVG Harita Stilleri */
        .map-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; align-items: center; position: relative; }
        .svg-container { width: 100%; max-height: 380px; display: flex; justify-content: center; align-items: center; background: #070d19; border-radius: 6px; padding: 10px; border: 1px solid #1e293b; }
        
        svg country-shape { cursor: pointer; fill: #334155; stroke: #0f172a; stroke-width: 1.5; transition: all 0.2s; }
        svg .country-node { cursor: pointer; transition: all 0.2s; }
        svg .country-node:hover circle { fill: #60a5fa; transform: scale(1.2); }
        svg .country-node.active circle { fill: #ef4444; stroke: #ffffff; stroke-width: 2; }
        svg .country-node.player circle { fill: #22c55e; stroke: #ffffff; stroke-width: 2; }
        svg text { font-size: 11px; fill: #f8fafc; font-weight: bold; pointer-events: none; text-anchor: middle; }

        .card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
        .card h3 { margin-bottom: 10px; font-size: 1rem; color: var(--accent); }

        .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
        .action-btn { background: #334155; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 0.85rem; transition: background 0.2s; }
        .action-btn:hover { background: #475569; }

        .news-feed { padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 0.8rem; }
        .news-item { padding: 8px; background: rgba(0,0,0,0.2); border-left: 3px solid var(--accent); border-radius: 4px; }
        
        .chat-box { height: 100px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; font-size: 0.8rem; }
        .chat-msg { padding: 5px 8px; border-radius: 6px; max-width: 80%; }
        .chat-msg.player { background: var(--accent); align-self: flex-end; }
        .chat-msg.ai { background: #334155; align-self: flex-start; }
        .chat-input-area { display: flex; gap: 6px; }
        .chat-input { flex: 1; background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; padding: 6px; color: white; font-size: 0.8rem; }
        .send-btn { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <div class="game-title">🌍 Modern Çağ Simülasyonu - Dünya Haritası</div>
        <div class="turn-display">
            <span id="current-date">Yıl: 2026 | Ay: Ocak</span>
            <button class="next-turn-btn" onclick="nextTurn()">Turu Bitir ➡️</button>
        </div>
    </header>
